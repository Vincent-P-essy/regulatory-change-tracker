[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regulatory-change-tracker"
version = "1.0.0"
description = "Structural diff of regulatory text, materiality grading, and impact mapping onto an internal control register"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vincent Plessy" }]
keywords = ["regtech", "compliance", "dora", "regulatory-change", "grc", "controls"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Topic :: Office/Business",
  "Topic :: Text Processing :: Markup",
]
dependencies = ["rich>=13.0", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
regwatch = "regwatch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/regwatch"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
